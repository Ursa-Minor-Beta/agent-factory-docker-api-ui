services:
  af-backend:
    build:
      context: .
      dockerfile: Dockerfile.back
      args:
        - API_VERSION=${API_VERSION}
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/agent-factory}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - LLM_MAX_TOOL_CALLS=${LLM_MAX_TOOL_CALLS:-}
      - LLM_CLIENT_TOOL_TIMEOUT_MS=${LLM_CLIENT_TOOL_TIMEOUT_MS:-60000}
      - WEBHOOK_PUBLIC_BASE_URL=${WEBHOOK_PUBLIC_BASE_URL:-http://localhost:3000}
      - WEBHOOK_MAX_BODY_BYTES=${WEBHOOK_MAX_BODY_BYTES:-1048576}
      - WEBHOOK_RATE_LIMIT_PER_MINUTE=${WEBHOOK_RATE_LIMIT_PER_MINUTE:-60}
      - WEBHOOK_HANDLER_TIMEOUT_MS=${WEBHOOK_HANDLER_TIMEOUT_MS:-1000}
      - WEBHOOK_HANDLER_MEMORY_MB=${WEBHOOK_HANDLER_MEMORY_MB:-32}
      - WEBHOOK_RUN_WAIT_TIMEOUT_MS=${WEBHOOK_RUN_WAIT_TIMEOUT_MS:-30000}
      - SCHEDULER_POLL_INTERVAL_MS=${SCHEDULER_POLL_INTERVAL_MS:-15000}
      - SCHEDULER_MAX_CONCURRENT_RUNS=${SCHEDULER_MAX_CONCURRENT_RUNS:-3}
    depends_on:
      mongo:
        condition: service_started
        required: false
    restart: unless-stopped

  af-frontend:
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        - UI_VERSION=${UI_VERSION}
        - VITE_API_URL=${VITE_API_URL}
        - VITE_APP_NAME=${VITE_APP_NAME}
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - af-backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-}
    restart: unless-stopped
    profiles:
      - with-db

volumes:
  mongo_data:
